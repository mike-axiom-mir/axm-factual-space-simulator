<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Frontier Survey Crew Stations</title>
  <style>
    :root{--bg:#04090d;--panel:#0b151b;--raised:#102028;--line:#34545f;--text:#edf8fa;--muted:#9eb2b8;--ok:#79e2d4;--caution:#f2cb70;--warning:#ff8585;--unknown:#c7afe6;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17323b,var(--bg) 48%);color:var(--text);font-family:system-ui,sans-serif}button,select{font:inherit}button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}header{align-items:center;border-bottom:2px solid var(--line);display:flex;gap:16px;justify-content:space-between;padding:12px 18px}header small,.explain,.eyebrow{color:var(--muted)}.eyebrow{font-size:.72rem;font-weight:750;letter-spacing:.12em;margin:0 0 4px;text-transform:uppercase}#mode{border:1px solid var(--line);border-radius:999px;padding:7px 11px;text-align:right}#mode small{display:block;font-size:.65rem}main{display:grid;grid-template-columns:240px minmax(0,1fr) 350px;min-height:calc(100vh - 70px)}nav{background:#071116;border-right:2px solid var(--line);padding:10px}nav button,.filter-button,.attention-action,select{background:#0c1a20;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px}nav button{display:block;margin:5px 0;text-align:left;width:100%}nav button[aria-pressed="true"],.filter-button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}.center,.side{overflow:auto;padding:14px}.side{background:#071116;border-left:2px solid var(--line)}.card,.surface{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;padding:11px}.attention{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) auto;margin-bottom:12px;padding:13px 14px}.attention.emergency,.attention.warning{border-color:var(--warning)}.attention.caution{border-color:var(--caution)}.attention.unavailable{border-color:var(--unknown)}.attention h2{font-size:1.1rem;margin:0 0 4px}.attention p{margin:4px 0 0}.attention-copy{max-width:66ch}.attention-action{align-self:center;cursor:pointer;white-space:nowrap}.attention-action:hover{border-color:var(--ok)}.attention-counts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.count{background:#071116;border-radius:999px;color:var(--muted);font-size:.75rem;padding:4px 8px}.count strong{color:var(--text)}.filters{align-items:center;display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}.filter-button{cursor:pointer;padding:7px 10px}#visibleCount{color:var(--muted);font-size:.8rem;margin-left:auto}.surfaces{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.surface h3{color:var(--ok);margin:0}.metrics{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.metric{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;color:var(--text);cursor:pointer;min-height:74px;padding:8px;text-align:left;transition:border-color 120ms ease,transform 120ms ease,background 120ms ease;width:100%}.metric:hover{border-color:var(--ok);transform:translateY(-1px)}.metric.caution{border-left-color:var(--caution)}.metric.warning,.metric.emergency{border-left-color:var(--warning)}.metric.unavailable{border-left-color:var(--unknown)}.metric[aria-pressed="true"]{background:#17323b;box-shadow:inset 0 0 0 2px var(--text)}.value{font-size:19px}.meta,.name{color:var(--muted);font-size:10px}.metric-detail{background:#071116;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:9px;grid-column:1/-1;padding:10px 12px}.metric-detail.caution{border-left-color:var(--caution)}.metric-detail.warning,.metric-detail.emergency{border-left-color:var(--warning)}.metric-detail.unavailable{border-left-color:var(--unknown)}.metric-detail h4{margin:0 0 6px}.metric-detail p{margin:4px 0}.status-label{font-weight:800;text-transform:uppercase}.empty-state{color:var(--muted);grid-column:1/-1;padding:16px 0}.alert{border-left:4px solid var(--line);margin:5px 0;padding:7px}.alert.caution{border-color:var(--caution)}.alert.warning,.alert.emergency{border-color:var(--warning)}.skill{border-bottom:1px solid var(--line);padding:8px}.visually-hidden{height:1px;margin:-1px;overflow:hidden;padding:0;position:absolute;width:1px;clip:rect(0 0 0 0);white-space:nowrap}
    @media(max-width:1000px){main{grid-template-columns:200px minmax(0,1fr)}.side{border-left:0;border-top:2px solid var(--line);grid-column:1/-1}}
    @media(max-width:650px){header{align-items:flex-start}main{display:block}nav{border-bottom:2px solid var(--line);border-right:0;overflow-x:auto;white-space:nowrap}nav button{display:inline-block;margin-right:4px;width:auto}.center,.side{padding:12px}.attention{grid-template-columns:1fr}.attention-action{justify-self:stretch;white-space:normal}.surfaces{grid-template-columns:1fr}#visibleCount{margin-left:0;width:100%}}
    @media(prefers-reduced-motion:reduce){.metric{transition:none}.metric:hover{transform:none}}
  </style>
</head>
<body>
  <header><div><b>FRONTIER SURVEY · CREW STATION TELEMETRY</b><br><small>Same ship state · different qualified perspectives</small></div><div id="mode"></div></header>
  <main>
    <nav id="nav" aria-label="Crew stations"></nav>
    <section class="center"><h1 id="title"></h1><section id="attention" class="card attention" aria-labelledby="attentionTitle"></section><div id="filterBar" class="filters" aria-label="Telemetry filters"></div><div id="surfaces" class="surfaces"></div></section>
    <aside class="side"><div class="card"><h3>Selected metric mirror</h3><div id="explain" class="explain">Select a metric. Its exact explanation also opens beside that card.</div></div><div class="card"><h3>Role learning pressure</h3><select id="role" aria-label="Crew role"></select><div id="skills"></div></div><div class="card"><h3>Alerts</h3><div id="alerts"></div></div><div class="card"><h3>Controls and consequences</h3><div id="controls"></div></div></aside>
  </main>
  <div id="announcer" role="status" aria-live="polite" class="visually-hidden"></div>
  <script type="application/json" id="data">__CREW_STATION_DATA__</script>
  <script>
    const D=JSON.parse(document.getElementById('data').textContent),N=document.getElementById('nav'),S=document.getElementById('surfaces'),E=document.getElementById('explain'),A=document.getElementById('attention'),F=document.getElementById('filterBar');
    const ORDER={emergency:0,warning:1,caution:2,unavailable:3,normal:4},ATTENTION=new Set(['emergency','warning','caution']);
    let currentStation='command_duet',currentFilter='all',selectedMetric=null;
    function f(value,unit){if(value===null||value===undefined)return'UNKNOWN';if(typeof value==='boolean')return value?'YES':'NO';if(typeof value==='number'){const suffix=unit&&!['state','mode','boolean'].includes(unit)?' '+unit:'';return value.toLocaleString(undefined,{maximumFractionDigits:3})+suffix}return String(value)}
    function cards(view){return view.surfaces.flatMap(surface=>surface.metric_cards)}
    function matches(card){if(currentFilter==='attention')return ATTENTION.has(card.status);if(currentFilter==='unavailable')return card.status==='unavailable';return true}
    function detail(card){const influence=card.control_influence_ids.join(', ')||'observation/indirect';return'<h4>'+card.display_name+' · <span class="status-label">'+card.status+'</span></h4><p>'+card.plain_language+'</p><p class="explain">Truth: '+card.truth_type+' · quality: '+card.quality.state+' · trend: '+card.trend+'</p><p class="explain">Influenced by: '+influence+'</p>'}
    function selectMetric(card,button,announce=true){selectedMetric=card.metric_id;document.querySelectorAll('.metric').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.metricId===selectedMetric)));document.querySelectorAll('.metric-detail').forEach(item=>item.remove());const panel=document.createElement('div');panel.className='metric-detail '+card.status;panel.dataset.forMetric=card.metric_id;panel.setAttribute('role','region');panel.setAttribute('aria-label',card.display_name+' details');panel.innerHTML=detail(card);button.insertAdjacentElement('afterend',panel);E.innerHTML=detail(card);if(announce)announcer.textContent=card.display_name+', '+card.status+', '+f(card.value,card.unit)}
    function renderAttention(view){const all=cards(view),counts={emergency:0,warning:0,caution:0,unavailable:0,normal:0};all.forEach(card=>counts[card.status]=(counts[card.status]||0)+1);const urgent=[...all].sort((a,b)=>ORDER[a.status]-ORDER[b.status])[0],attentionCount=counts.emergency+counts.warning+counts.caution;A.className='card attention '+urgent.status;A.innerHTML='<div class="attention-copy"><p class="eyebrow">Derived display priority · canonical mode unchanged</p><h2 id="attentionTitle">'+(attentionCount?attentionCount+' telemetry cards need attention':'No attention states in this view')+'</h2><p>Highest display priority: <strong>'+urgent.display_name+'</strong> · '+urgent.status.toUpperCase()+' · '+f(urgent.value,urgent.unit)+'</p><div class="attention-counts"><span class="count"><strong>'+counts.emergency+'</strong> emergency</span><span class="count"><strong>'+counts.warning+'</strong> warning</span><span class="count"><strong>'+counts.caution+'</strong> caution</span><span class="count"><strong>'+counts.unavailable+'</strong> unavailable</span></div></div><button type="button" class="attention-action">Inspect '+urgent.display_name+'</button>';A.querySelector('button').onclick=()=>{if(!matches(urgent)){currentFilter=ATTENTION.has(urgent.status)?'attention':urgent.status==='unavailable'?'unavailable':'all';renderFilters(view);renderSurfaces(view)}const button=document.querySelector('.metric[data-metric-id="'+urgent.metric_id+'"]');selectMetric(urgent,button);button.focus();button.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
    function renderFilters(view){const all=cards(view),definitions=[['all','All',all.length],['attention','Attention',all.filter(card=>ATTENTION.has(card.status)).length],['unavailable','Unavailable',all.filter(card=>card.status==='unavailable').length]];F.innerHTML='';definitions.forEach(([id,label,count])=>{const button=document.createElement('button');button.type='button';button.className='filter-button';button.dataset.filter=id;button.setAttribute('aria-pressed',String(currentFilter===id));button.textContent=label+' · '+count;button.onclick=()=>{currentFilter=id;selectedMetric=null;renderFilters(view);renderSurfaces(view);announcer.textContent=label+' filter, '+count+' telemetry cards'};F.appendChild(button)});const visible=document.createElement('span');visible.id='visibleCount';visible.textContent=all.filter(matches).length+' of '+all.length+' cards visible';F.appendChild(visible)}
    function renderSurfaces(view){S.innerHTML='';view.surfaces.forEach(surface=>{const visible=surface.metric_cards.filter(matches);if(!visible.length)return;const box=document.createElement('section');box.className='surface';box.innerHTML='<h3>'+surface.id.replaceAll('_',' ').toUpperCase()+'</h3><p class="explain">'+surface.purpose+'</p>';const grid=document.createElement('div');grid.className='metrics';visible.forEach(card=>{const button=document.createElement('button');button.type='button';button.className='metric '+card.status;button.dataset.metricId=card.metric_id;button.setAttribute('aria-pressed',String(card.metric_id===selectedMetric));button.setAttribute('aria-label',card.display_name+', '+card.status+', '+f(card.value,card.unit));button.innerHTML='<div class="name">'+card.display_name+'</div><div class="value">'+f(card.value,card.unit)+'</div><div class="meta">'+card.status+' · '+card.trend+' · '+card.quality.state+'<br>'+card.truth_type+'</div>';button.onclick=()=>selectMetric(card,button);grid.appendChild(button)});box.appendChild(grid);S.appendChild(box)});if(!S.children.length)S.innerHTML='<p class="empty-state">No telemetry cards match this filter in the current station.</p>'}
    function station(id){currentStation=id;currentFilter='all';selectedMetric=null;document.querySelectorAll('nav button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.id===id)));const view=D.stations[id];title.textContent=view.display_name;mode.innerHTML='<small>CANONICAL SHIP MODE</small><strong>'+view.mode.toUpperCase()+'</strong>';renderAttention(view);renderFilters(view);renderSurfaces(view);alerts.innerHTML='';view.alert_queue.slice(0,14).forEach(alert=>{const row=document.createElement('div');row.className='alert '+alert.priority;row.innerHTML='<b>'+alert.priority.toUpperCase()+' · '+alert.name+'</b><br><small>'+alert.system_id+' · t='+alert.timestamp+' min</small>';alerts.appendChild(row)});controls.innerHTML='';view.controls.forEach(control=>{const row=document.createElement('p');row.className='explain';row.innerHTML='<b>'+control.display_name+'</b><br>Direct: '+control.directly_influences.join(', ')+'<br>Secondary: '+control.secondary_consequences.join(', ');controls.appendChild(row)})}
    Object.entries(D.stations).forEach(([id,view])=>{const button=document.createElement('button');button.type='button';button.textContent=view.display_name;button.dataset.id=id;button.setAttribute('aria-pressed','false');button.onclick=()=>station(id);button.onkeydown=event=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;event.preventDefault();const buttons=[...N.querySelectorAll('button')],index=buttons.indexOf(button),next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();buttons[next].click()};N.appendChild(button)});
    Object.keys(D.learning).forEach(id=>{const option=document.createElement('option');option.value=id;option.textContent=id.replaceAll('_',' ');role.appendChild(option)});function learn(){skills.innerHTML='';D.learning[role.value].ranked_skills.forEach((skill,index)=>{const row=document.createElement('div');row.className='skill';row.innerHTML='<b>'+(index+1)+'. '+skill.display_name+'</b><br><small>'+(skill.learning_pressure*100).toFixed(1)+'% operational pressure · level '+skill.current_level+'<br>abnormal: '+(skill.abnormal_metric_ids.join(', ')||'none')+'</small>';skills.appendChild(row)})}role.onchange=learn;role.value='vehicle_systems_engineer';learn();station(currentStation);
  </script>
</body>
</html>
