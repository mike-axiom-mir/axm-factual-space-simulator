name: Generate deterministic seal repair

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: factual-space-seal-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reseal:
    name: Generate repaired seal
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore canonical verifier bytes in worktree
        shell: bash
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/verify.yml" > .github/workflows/verify.yml
      - name: Regenerate deterministic package seal
        run: python tools/reseal_package.py --write
      - name: Check regenerated seal
        run: python tools/reseal_package.py --check
      - name: Upload repaired seal files
        uses: actions/upload-artifact@v4
        with:
          name: pr4-repaired-seal
          path: |
            PACKAGE_MANIFEST.json
            CHECKSUMS.sha256
          if-no-files-found: error
      - name: Verify canonical and generated snapshots
        run: python verify_package.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Run structural handoff audit
        run: python -m axm_star_sim.handoff_cli audit
