name: Verify deterministic package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factual-space-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check deterministic package seal
        run: python tools/reseal_package.py --check
      - name: Verify canonical and generated snapshots
        run: python verify_package.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Run structural handoff audit
        run: python -m axm_star_sim.handoff_cli audit
