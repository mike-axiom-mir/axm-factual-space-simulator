name: Reseal and verify v0.8 steward

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: factual-space-v08-reseal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reseal:
    name: Reseal, verify, and restore canonical CI
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assemble staged v0.8 source
        shell: bash
        run: |
          cat .staging/v08/fault_clearance_apply.py.part* > src/axm_star_sim/fault_clearance_apply.py
          cat .staging/v08/test_fault_clearance_apply.py.part* > tests/test_fault_clearance_apply.py
          rm -rf .staging/v08
      - name: Restore canonical verifier in worktree
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('.github/workflows/verify.yml').write_bytes(base64.b64decode(''))
          PY
      - name: Regenerate deterministic package seal
        run: python tools/reseal_package.py --write
      - name: Check regenerated seal
        run: python tools/reseal_package.py --check
      - name: Verify canonical and generated snapshots
        run: python verify_package.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Run structural handoff audit
        run: python -m axm_star_sim.handoff_cli audit
      - name: Commit repaired seal and restore canonical verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reseal changes to commit."
          else
            git commit -m "chore: reseal authoritative fault clearance v0.8"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
