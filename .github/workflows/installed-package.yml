name: Verify installed package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factual-space-installed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-package:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check deterministic source seal
        run: python tools/reseal_package.py --check
      - name: Build, install, and exercise wheel offline
        run: python -m unittest discover -s tests -p "test_installed_package.py" -v
