name: Bootstrap factual public discovery seal

on:
  push:
    branches:
      - automation/capability-weaver-factual-discovery-v1

permissions:
  contents: write

concurrency:
  group: factual-space-discovery-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reseal:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/capability-weaver-factual-discovery-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Materialize generated discovery truth and remove this one-shot writer
        run: |
          git rm .github/workflows/bootstrap-public-discovery.yml
          python tools/generate_public_capabilities.py --write
          python tools/reseal_package.py --write
      - name: Verify generated discovery and package seal
        run: |
          python tools/generate_public_capabilities.py --check
          python -m unittest -v tests.test_public_capability_discovery
          python tools/reseal_package.py --check
      - name: Run repository acceptance before publication
        run: bash run_local_acceptance.sh
      - name: Commit the no-writer sealed tree
        run: |
          git config user.name "axm-capability-weaver"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Seal generated factual capability discovery"
          git push origin HEAD:automation/capability-weaver-factual-discovery-v1
