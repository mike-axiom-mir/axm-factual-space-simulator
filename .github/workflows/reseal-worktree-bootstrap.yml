name: One-shot worktree seal bootstrap

on:
  push:
    branches:
      - automation/package-seal-worktree-invariance-20260910

permissions:
  contents: write

jobs:
  reseal-and-remove-self:
    if: github.repository == 'mike-axiom-mir/axm-factual-space-simulator' && github.ref == 'refs/heads/automation/package-seal-worktree-invariance-20260910'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Remove bootstrap, reseal final tree, and fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reseal-worktree-bootstrap.yml
          PYTHONPATH=src python tools/reseal_package.py --write
          git add -A -- .github/workflows/reseal-worktree-bootstrap.yml PACKAGE_MANIFEST.json CHECKSUMS.sha256
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reseal worktree-invariant package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
