name: Contact Horizon experience bootstrap

on:
  push:
    branches:
      - automation/experience-contact-readiness-20260910

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build bounded Contact Horizon experience change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_demo_v0_7.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('def contact_html(')
          end = source.index('\n\ndef build_persistent_atlas_demo', start)
          replacement = r'''def contact_html(registry: dict, locked: dict, eligible: dict, after: dict, event: dict, next_actions: list[dict]) -> str:
              payload = json.dumps({
                  "registry": registry,
                  "locked": locked,
                  "eligible": eligible,
                  "after": after,
                  "event": {
                      "event_id": event["event_id"],
                      "action": event["action"],
                      "intent": event.get("action_record", {}).get("intent", ""),
                      "outcome": event["outcome"],
                      "entropy_mode": event["entropy"]["mode"],
                      "event_hash": event["event_hash"],
                  },
                  "next_actions": [
                      {
                          "action_id": action["action_id"],
                          "label": action["label"],
                          "category": action["category"],
                          "intent": action.get("intent", ""),
                      }
                      for action in next_actions[:4]
                  ],
              }, ensure_ascii=False)
              return '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AXM Long Horizon Contact Layer</title><style>
          :root{--bg:#05080d;--panel:#0d1822;--line:#294658;--text:#edf6fa;--muted:#9db1bd;--accent:#72dce9;--warm:#efc77b;--danger:#ef9e9e;--ok:#8be0b1}
          *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102330,#05080d 55%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:22px}h1{font-weight:500;letter-spacing:.07em;margin-bottom:.35rem}h2{font-weight:600}h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--warm);margin:18px 0 9px}.lead{max-width:920px;line-height:1.65;color:var(--muted)}.truthbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.truthbar span{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:.72rem;letter-spacing:.08em}.truthbar .hold{border-color:#7d5f37;color:var(--warm)}.checkpoint-shell{margin:20px 0 15px}.checkpoint-label{font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tabs button{min-height:48px;border:1px solid var(--line);background:#0b151e;color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left}.tabs button small{display:block;color:var(--muted);margin-top:4px}.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);background:#0c2028}.tabs button:focus-visible,.action:focus-visible{outline:3px solid var(--warm);outline-offset:3px}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:14px;align-items:start}.card{background:linear-gradient(180deg,#10202c,var(--panel));border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid #203441}.metric span{color:var(--muted)}.ceiling{border-left:3px solid var(--warm);padding:12px 14px;background:#0a131b;color:var(--text);line-height:1.55}.readiness{display:grid;gap:7px}.check{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:9px}.check b{font-size:.72rem;min-width:43px}.check.pass b{color:var(--ok)}.check.hold b{color:var(--danger)}.check span{color:var(--muted);font-size:.86rem;line-height:1.35}.candidate{display:flex;gap:7px;flex-wrap:wrap}.candidate span{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:.76rem}.actions{display:grid;gap:8px}.action{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0a131b}.action strong{display:block;color:var(--accent);margin-bottom:4px}.action p{margin:0;color:var(--muted);line-height:1.4;font-size:.88rem}.action code{display:block;margin-top:5px;color:#7fa2b5;font-size:.68rem;word-break:break-all}.ladder{display:grid;gap:7px}.rung{padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.rung.active{border-color:var(--warm);color:var(--text);background:#17170e}.rung strong{color:var(--accent)}.event{margin-top:10px}.boundary{border-left:3px solid var(--warm);padding:12px 14px;background:#0a131b;color:var(--muted);margin:14px 0}.danger{color:var(--danger)}code{color:var(--accent);word-break:break-all}.sr-status{position:relative;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--muted);font-size:.82rem;margin:10px 0 0}.sr-status strong{color:var(--text)}
          @media(max-width:800px){main{padding:16px}.grid{grid-template-columns:1fr}.tabs{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px}.tabs button{flex:0 0 min(79vw,280px);scroll-snap-align:start}.metric{grid-template-columns:1fr}.metric strong{text-align:left}.card{padding:14px}}
          @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
          @media(prefers-contrast:more){:root{--line:#6f96aa;--muted:#c1d0d8}.card,.tabs button,.check,.action{border-width:2px}}
          </style></head><body><main><div style="color:var(--warm);font-size:.8rem;letter-spacing:.12em">MIKE — AXIOM/MIR · v0.7.0</div><h1>Long Horizon contact layer</h1><p class="lead">Step 100,000 is not an alien encounter. It is the earliest point at which a deeply worked campaign can open dedicated life and technology searches. The master seed contains no hidden species, intention, or contact date.</p><div class="truthbar"><span>LOCAL RECEIPT VIEW</span><span>DISPLAY ≠ DISCOVERY</span><span class="hold">SEARCH READINESS ≠ CONTACT</span></div><div class="boundary"><strong>Factual boundary:</strong> the simulator can generate evidence, uncertainty, theories, instruments, delays, and consequences. It cannot turn a theory into a factual extraterrestrial civilization.</div><section class="checkpoint-shell"><div class="checkpoint-label">Recorded campaign checkpoints · inspect only</div><div class="tabs" role="tablist" aria-label="Recorded Contact Horizon checkpoints"><button role="tab" id="tab-locked" aria-controls="checkpoint" aria-selected="true" tabindex="0" data-view="locked">Step 99,999<small>readiness held</small></button><button role="tab" id="tab-eligible" aria-controls="checkpoint" aria-selected="false" tabindex="-1" data-view="eligible">Step 100,000<small>eligibility boundary</small></button><button role="tab" id="tab-after" aria-controls="checkpoint" aria-selected="false" tabindex="-1" data-view="after">First deep search<small>recorded result</small></button></div><div id="liveStatus" class="sr-status" role="status" aria-live="polite"></div></section><div class="grid"><section id="checkpoint" role="tabpanel" aria-labelledby="tab-locked" class="card"><h2 id="phase"></h2><div id="metrics"></div><h3>Current claim ceiling</h3><p id="ceiling" class="ceiling"></p><h3>Readiness gate</h3><div id="readiness" class="readiness"></div><div id="candidateWrap" hidden><h3>Candidate classes still open</h3><div id="candidate" class="candidate"></div></div><h3>Next scientific move</h3><div id="actions" class="actions"></div><h3>Demonstration event</h3><div id="event" class="event"></div></section><section class="card"><h2>Evidence ladder</h2><p class="lead">The highlight is the recorded stage at this checkpoint. Higher rungs remain definitions, not predictions.</p><div id="ladder" class="ladder"></div></section></div><p class="lead">The first deep-search event is replayable from its recorded deterministic entropy packet. Its result may create a candidate anomaly, but it cannot jump directly to confirmed life, technology, agency, or interaction.</p></main><script>
          const data=__PAYLOAD__;let view='locked';const order=['locked','eligible','after'];const buttons=[...document.querySelectorAll('button[data-view]')];
          const checkLabels={step_reached:['Step boundary','step 100,000 reached'],science_actions:['Science depth','minimum science actions satisfied'],independent_observation_contexts:['Independent contexts','independent observation contexts satisfied'],cross_validations:['Cross-validation','cross-validation floor satisfied'],false_positive_eliminations:['False-positive work','false-positive elimination floor satisfied'],passive_search_hours:['Passive search','passive search duration satisfied']};
          const esc=value=>String(value??'').replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
          function metric(k,v){return `<div class="metric"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`}
          function renderReadiness(s){return Object.entries(s.readiness.checks).map(([key,passed])=>{const label=checkLabels[key]||[key,key];return `<div class="check ${passed?'pass':'hold'}"><b>${passed?'PASS':'HOLD'}</b><span><strong>${esc(label[0])}</strong><br>${esc(label[1])}</span></div>`}).join('')}
          function renderActions(){if(view==='locked')return '<div class="action"><strong>Deep search held</strong><p>The recorded readiness checks are not satisfied, so this checkpoint admits no deep-search action.</p></div>';if(view==='eligible')return `<div class="action"><strong>${esc(data.event.action)}</strong><p>${esc(data.event.intent||'Recorded demonstration action at the eligibility boundary.')}</p><code>${esc(data.event.event_id)}</code></div>`;if(!data.next_actions.length)return '<div class="action"><strong>No later action in this demo receipt</strong><p>The observer will not invent a continuation.</p></div>';return data.next_actions.map(a=>`<div class="action"><strong>${esc(a.label)}</strong><p>${esc(a.intent||a.category)}</p><code>${esc(a.action_id)}</code></div>`).join('')}
          function render(){const s=data[view];buttons.forEach(b=>{const active=b.dataset.view===view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});const panel=document.getElementById('checkpoint');panel.setAttribute('aria-labelledby',`tab-${view}`);document.getElementById('phase').textContent=`${s.evidence_stage_name} · stage ${s.evidence_stage}`;document.getElementById('metrics').innerHTML=metric('Current step',s.current_step.toLocaleString())+metric('Search readiness',s.readiness.ready?'READY — ELIGIBLE TO SEARCH':'HELD — SEARCH NOT ADMITTED')+metric('Candidate',s.candidate_id||'none')+metric('External life confirmed',s.confirmed_external_life?'yes':'no')+metric('External technology confirmed',s.confirmed_external_technology?'yes':'no')+metric('External agency confirmed',s.confirmed_external_agency?'yes':'no');document.getElementById('ceiling').textContent=s.claim_ceiling;document.getElementById('readiness').innerHTML=renderReadiness(s);const candidateWrap=document.getElementById('candidateWrap');candidateWrap.hidden=!s.candidate_classes.length;document.getElementById('candidate').innerHTML=s.candidate_classes.map(c=>`<span>${esc(c.id)} · ${esc(c.status)}</span>`).join('');document.getElementById('actions').innerHTML=renderActions();document.getElementById('ladder').innerHTML=data.registry.evidence_ladder.map(r=>`<div class="rung ${r.stage===s.evidence_stage?'active':''}"><strong>${esc(r.stage)}. ${esc(r.name)}</strong><br>${esc(r.claim_ceiling)}</div>`).join('');const e=data.event;document.getElementById('event').innerHTML=view==='after'?metric('Action',e.action)+metric('Outcome',e.outcome.title)+metric('Entropy',e.entropy_mode)+`<p><code>${esc(e.event_hash)}</code></p>`:'<p class="lead">No encounter is inserted at this checkpoint.</p>';document.getElementById('liveStatus').innerHTML=`<strong>${esc(buttons.find(b=>b.dataset.view===view).textContent.trim())}</strong> · ${s.readiness.ready?'search ready':'search held'} · evidence stage ${esc(s.evidence_stage)} · external life confirmed: ${s.confirmed_external_life?'yes':'no'}`}
          function select(next,focus=false){view=next;render();if(focus)buttons[order.indexOf(view)].focus()}
          buttons.forEach((b,index)=>{b.addEventListener('click',()=>select(b.dataset.view));b.addEventListener('keydown',event=>{let target=null;if(event.key==='ArrowRight')target=(index+1)%buttons.length;if(event.key==='ArrowLeft')target=(index-1+buttons.length)%buttons.length;if(event.key==='Home')target=0;if(event.key==='End')target=buttons.length-1;if(target!==null){event.preventDefault();select(buttons[target].dataset.view,true)}})});render();
          </script></body></html>'''.replace('__PAYLOAD__', payload)
          '''
          source = source[:start] + replacement + source[end:]
          old_call = 'contact_html(registry, locked, eligible, after, event)'
          new_call = 'contact_html(registry, locked, eligible, after, event, after_state["action_menu"]["actions"])'
          if source.count(old_call) != 1:
              raise SystemExit(f'Expected one Contact Horizon render call, found {source.count(old_call)}')
          source = source.replace(old_call, new_call)
          path.write_text(source, encoding='utf-8')

          test = Path('tests/test_contact_horizon_experience.py')
          test.write_text(r'''from __future__ import annotations

import json
import unittest
from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]
HTML = ROOT / "output" / "contact_horizon_demo" / "contact_horizon_console.html"
RECEIPT = ROOT / "output" / "contact_horizon_demo" / "contact_horizon_demo.json"


class ContactHorizonExperienceTests(unittest.TestCase):
    def test_shipped_surface_exposes_readiness_and_authority_boundaries(self) -> None:
        page = HTML.read_text(encoding="utf-8")
        self.assertIn('role="tablist"', page)
        self.assertIn('aria-live="polite"', page)
        self.assertIn('SEARCH READINESS ≠ CONTACT', page)
        self.assertIn('DISPLAY ≠ DISCOVERY', page)
        self.assertIn('Readiness gate', page)
        self.assertIn('Next scientific move', page)
        self.assertIn("ArrowRight", page)
        self.assertIn("aria-selected", page)

    def test_surface_reuses_exact_recorded_claim_and_action_truth(self) -> None:
        page = HTML.read_text(encoding="utf-8")
        receipt = json.loads(RECEIPT.read_text(encoding="utf-8"))
        for key in ("locked", "eligible", "after_first_search"):
            snapshot = receipt[key]
            self.assertIn(snapshot["claim_ceiling"], page)
            self.assertIn(snapshot["evidence_stage_name"], page)
        self.assertIn(receipt["event"]["event_id"], page)
        self.assertIn(receipt["event"]["action"], page)
        self.assertFalse(receipt["after_first_search"]["confirmed_external_life"])

    def test_readiness_projection_keeps_all_six_canonical_checks(self) -> None:
        receipt = json.loads(RECEIPT.read_text(encoding="utf-8"))
        self.assertEqual(6, len(receipt["locked"]["readiness"]["checks"]))
        self.assertTrue(all(value is False for value in receipt["locked"]["readiness"]["checks"].values()))
        self.assertTrue(all(value is True for value in receipt["eligible"]["readiness"]["checks"].values()))


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Regenerate Contact Horizon demo and deterministic indexes
        shell: bash
        run: |
          python scripts/build_demo_v0_7.py
          python scripts/refresh_output_snapshot_v0_15.py
          rm .github/workflows/contact-horizon-experience-bootstrap.yml
          python tools/reseal_package.py --write

      - name: Focused experience and science contracts
        shell: bash
        run: |
          python -m unittest tests.test_contact_horizon tests.test_contact_horizon_experience -v
          python tools/reseal_package.py --check
          python verify_package.py

      - name: Full local acceptance
        shell: bash
        run: bash run_local_acceptance.sh

      - name: Commit exact tested tree locally
        shell: bash
        run: |
          git config user.name "AXM Experience Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Experience: make Contact Horizon readiness inspectable"
          git rev-parse HEAD | tee /tmp/final-head.txt

      - name: Exercise exact committed surface in Chromium
        shell: bash
        run: |
          mkdir -p /tmp/axm-pw /tmp/contact-evidence
          npm install --prefix /tmp/axm-pw playwright@1.55.0
          /tmp/axm-pw/node_modules/.bin/playwright install chromium
          python -m http.server 8765 --directory output/contact_horizon_demo >/tmp/contact-http.log 2>&1 &
          echo $! >/tmp/contact-http.pid
          cat >/tmp/contact-browser.cjs <<'JS'
          const { chromium } = require('/tmp/axm-pw/node_modules/playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            async function exercise(width,height,path){
              const page=await browser.newPage({viewport:{width,height}});
              page.on('pageerror',e=>errors.push('page:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              await page.goto('http://127.0.0.1:8765/contact_horizon_console.html',{waitUntil:'networkidle'});
              const selected=()=>page.locator('[role="tab"][aria-selected="true"]');
              if(!(await selected().textContent()).includes('Step 99,999')) throw new Error('locked checkpoint not selected initially');
              if(await page.locator('.check.hold').count()!==6) throw new Error('locked checkpoint must expose 6 held readiness checks');
              await page.getByRole('tab',{name:/Step 100,000/}).click();
              if(await page.locator('.check.pass').count()!==6) throw new Error('eligible checkpoint must expose 6 passed readiness checks');
              const ready=await page.locator('#metrics').textContent();
              if(!ready.includes('READY — ELIGIBLE TO SEARCH')) throw new Error('search eligibility state not exposed');
              await page.getByRole('tab',{name:/First deep search/}).click();
              if(await page.locator('#candidate span').count()<1) throw new Error('candidate classes not exposed');
              if(await page.locator('#actions .action').count()<1) throw new Error('next science actions not exposed');
              const ceiling=await page.locator('#ceiling').textContent();
              if(!ceiling.includes('unusual')) throw new Error('recorded candidate claim ceiling not exposed');
              await page.getByRole('tab',{name:/First deep search/}).focus();
              await page.keyboard.press('ArrowLeft');
              if(!(await selected().textContent()).includes('Step 100,000')) throw new Error('arrow-key checkpoint navigation failed');
              await page.keyboard.press('End');
              if(!(await selected().textContent()).includes('First deep search')) throw new Error('End checkpoint navigation failed');
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
              if(overflow) throw new Error(`horizontal overflow at ${width}x${height}`);
              await page.screenshot({path,fullPage:true});
              await page.close();
            }
            await exercise(1440,1000,'/tmp/contact-evidence/contact-horizon-desktop.png');
            await exercise(390,844,'/tmp/contact-evidence/contact-horizon-mobile.png');
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
            const receipt={head:fs.readFileSync('/tmp/final-head.txt','utf8').trim(),browser:'Chromium via Playwright 1.55.0',desktop:'1440x1000',mobile:'390x844',checks:['6 HOLD readiness checks before unlock','6 PASS readiness checks at unlock','recorded candidate classes visible','recorded next science actions visible','claim ceiling visible','ArrowLeft and End tab navigation','no horizontal overflow','no page or console errors']};
            fs.writeFileSync('/tmp/contact-evidence/receipt.json',JSON.stringify(receipt,null,2));
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          node /tmp/contact-browser.cjs
          kill "$(cat /tmp/contact-http.pid)" || true

      - name: Push exact verified tree
        shell: bash
        run: git push origin HEAD:automation/experience-contact-readiness-20260910

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: contact-horizon-experience-evidence
          path: /tmp/contact-evidence
          if-no-files-found: error
