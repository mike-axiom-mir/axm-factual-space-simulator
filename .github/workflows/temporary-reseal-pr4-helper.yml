name: Temporary PR4 reseal helper

on:
  push:
    branches:
      - automation/reseal-pr4-helper

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Recreate target-tree seal
        shell: bash
        run: |
          rm .github/workflows/temporary-reseal-pr4-helper.yml
          python tools/reseal_package.py --write
          python tools/reseal_package.py --check
      - name: Persist exact seal files on helper branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PACKAGE_MANIFEST.json CHECKSUMS.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'chore: reseal PR4 candidate package' -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
            git push origin HEAD:automation/reseal-pr4-helper
          fi
