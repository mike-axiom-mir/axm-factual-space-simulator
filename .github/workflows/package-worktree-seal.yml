name: Package worktree seal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-worktree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate expected canonical seal
        env:
          PYTHONPATH: src
        run: python tools/reseal_package.py --write

      - name: Preserve generated seal for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-worktree-seal-preview
          path: |
            PACKAGE_MANIFEST.json
            CHECKSUMS.sha256
          if-no-files-found: error

      - name: Require committed seal to match generated bytes
        run: git diff --exit-code -- PACKAGE_MANIFEST.json CHECKSUMS.sha256

      - name: Create real linked worktree
        run: git worktree add --detach ../factual-space-linked-worktree HEAD

      - name: Verify canonical seal in linked worktree
        working-directory: ../factual-space-linked-worktree
        env:
          PYTHONPATH: src
        run: python tools/reseal_package.py --check

      - name: Run package seal regressions in linked worktree
        working-directory: ../factual-space-linked-worktree
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_package_seal.py" -v
