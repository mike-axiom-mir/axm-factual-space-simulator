name: One-shot branch reseal

on:
  push:
    branches:
      - automation/registry-data-root-fix-20260909

permissions:
  contents: write

jobs:
  reseal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/registry-data-root-fix-20260909
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Remove one-shot workflow and reseal canonical package
        shell: bash
        run: |
          rm .github/workflows/automation-reseal-once.yml
          python tools/reseal_package.py --write
          python -m unittest tests.test_registry_paths
      - name: Commit deterministic reseal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Reseal package for registry path fix'
          git push origin HEAD:automation/registry-data-root-fix-20260909
